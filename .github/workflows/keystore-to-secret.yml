name: keystore-to-secret
# 한 번만 쓰는 워크플로(docs/decisions/0067). Actions 캐시에만 있는 디버그 서명 키를 Secret ANDROID_DEBUG_KEYSTORE_B64로 옮긴다.
# 왜: 캐시는 7일 넘게 안 쓰면 지워진다. 키가 바뀌면 기기에서 덮어 설치가 안 된다(지우고 깔면 기록도 지워진다).
# GITHUB_TOKEN은 Secret을 쓸 수 없어서 사람이 만든 임시 토큰(Secret SECRETS_TOKEN, 이 레포 하나·Secrets 읽기/쓰기)을 쓴다.
# 키는 로그·아티팩트에 남기지 않는다. 끝나면 이 파일과 SECRETS_TOKEN·토큰을 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
      # 지금 배포된 APK(v0.1.0~v0.1.2)를 서명한 인증서. 다른 키면 옮기지 않는다.
      EXPECTED_SHA256: 83:EF:43:35:C9:16:F7:1B:FC:2A:61:DB:7B:3A:2F:9A:39:3E:26:5D:08:44:70:1F:A0:A8:0A:84:9C:E2:F2:63
    steps:
      - name: Restore debug keystore from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Check fingerprint
        run: |
          got=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | sed -n 's/.*SHA256: *//p' | head -1)
          echo "keystore SHA-256: $got"
          if [ "$got" != "$EXPECTED_SHA256" ]; then
            echo "::error::캐시의 키가 배포된 APK의 키와 다르다. 옮기지 않는다."
            exit 1
          fi
      - name: Write secret ANDROID_DEBUG_KEYSTORE_B64
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SECRETS_TOKEN이 없다(이 레포 하나, Repository permissions → Secrets: Read and write)."
            exit 1
          fi
          base64 -w0 ~/.android/debug.keystore | gh secret set ANDROID_DEBUG_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -E '^ANDROID_DEBUG_KEYSTORE_B64\b'
          echo "### ANDROID_DEBUG_KEYSTORE_B64 를 썼다. 이제 SECRETS_TOKEN과 이 워크플로를 지운다." >> "$GITHUB_STEP_SUMMARY"
