name: smoke-web
# 웹 빌드 연기 시험(docs/decisions/0169 R7). 헤드리스 Chromium으로 타이틀 → 개발 시나리오 몇 개를 띄워 입력을 넣고
# 콘솔 에러·패닉·멈춘 화면을 잡는다(tools/test/smoke.js). 단위 테스트가 못 보는 wasm·JS 번들·로딩 화면·그리기 경로.
# main push(관련 파일)와 수동 실행. 스크린숏은 아티팩트로.
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/test/**'
      - '.github/workflows/smoke-web.yml'
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
    steps:
      - uses: actions/checkout@v4
      # 유료 에셋 팩(레포 밖, 0010). 시크릿이 없으면 건너뛰고 직접 그린 대체 타일로(팩 그림의 404는 smoke.js가 잡음으로 거른다).
      - name: Fetch vendor assets (private repo)
        if: env.ASSETS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets/vendor
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # 연기 시험은 타이틀 "개발" 메뉴로 장면에 들어가므로 개발 기능을 넣은 빌드로 돈다(main도). 운영판 빌드 자체는
      # deploy-web이 만들고 clippy(--no-default-features)로 본다(0193).
      - run: cargo build --release --target wasm32-unknown-unknown

      # deploy-web.yml의 "Assemble publish dir"과 같게(유료 팩 없이 직접 그린 대체 타일).
      - name: Assemble dist
        run: |
          mkdir -p dist
          cp web/index.html web/*.js dist/
          cp assets/THIRD_PARTY_LICENSES.txt dist/
          cp target/wasm32-unknown-unknown/release/nail.wasm dist/
          cp -r assets dist/assets

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tools/test
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/test/smoke.js dist smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-out
