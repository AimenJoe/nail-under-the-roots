name: build-android
# Android APK 빌드 (docs/decisions/0005). cargo-quad-apk로 miniquad의 MainActivity를 포함한 APK를 만든다.
# - 모든 브랜치 push(관련 파일이 바뀔 때)와 수동 실행: 디버그 키로 서명된 APK를 Actions 아티팩트로 올린다.
# - `v*` 태그 push: 같은 APK를 GitHub Release에 첨부한다.
# 러너(ubuntu-latest)에 Android SDK(build-tools, platforms;android-36)·NDK·JDK 17이 미리 깔려 있어 설치 단계가 없다.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # not-fl3/cargo-quad-apk master, 2026-07-28 (NDK 29 lib64 대응, API 36). 올릴 때 README 체크리스트 참조.
  CARGO_QUAD_APK_REV: d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그 push 시 Release 생성
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-quad-apk binary
        id: cqa
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-quad-apk
          key: cargo-quad-apk-${{ runner.os }}-${{ env.CARGO_QUAD_APK_REV }}
      - name: Install cargo-quad-apk
        if: steps.cqa.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/not-fl3/cargo-quad-apk --rev "$CARGO_QUAD_APK_REV"

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          java -version

      # 서명 키를 빌드마다 바꾸면 기기에서 이전 빌드 위에 설치할 수 없다("패키지가 유효하지 않음").
      # 우선순위: Secrets의 키 → Actions 캐시에 남은 키 → 새로 생성(경고). docs/decisions/0005 후속.
      - name: Restore debug keystore from cache
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Install debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "keystore: from secret ANDROID_DEBUG_KEYSTORE_B64"
          elif [ -f ~/.android/debug.keystore ]; then
            echo "keystore: from Actions cache"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 시크릿이 없어 새 디버그 키를 만든다. 이전 빌드 위에 설치하려면 기기에서 먼저 삭제해야 한다."
          fi

      - name: Build APK (release, debug-signed)
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          cargo quad-apk build --release
          ls -la target/android-artifacts/release/apk

      - name: Verify APK (signature, manifest, ABI)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=target/android-artifacts/release/apk/nail.apk
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "fingerprint" || true
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|native-code|launchable-activity|application-label|uses-feature|uses-gl-es" || true
          unzip -l "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: nail-apk-${{ github.sha }}
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/android-artifacts/release/apk/*.apk
          generate_release_notes: true
