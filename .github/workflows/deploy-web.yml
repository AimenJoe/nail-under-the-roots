name: deploy-web
# 웹 빌드·배포(0001). 갈래(0193):
# - main: 운영판. 개발 기능을 뺀 빌드(--no-default-features)를 Netlify 운영 주소에.
# - release/**: 마일스톤 개발판. 개발 기능을 넣은 빌드를 같은 사이트의 별칭 `dev`(dev--<사이트>.netlify.app)에.
#   운영과 주소(= 브라우저 저장소)가 달라 기록이 섞이지 않는다. 배포 뒤 그 주소의 build.txt가 이 커밋인지 확인한다.
# - PR: 개발판을 pr-<번호> 별칭에.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      # 유료 에셋 팩(레포 밖, docs/decisions/0010). 시크릿이 없으면 건너뛰고 직접 그린 대체 타일로 빌드한다.
      - name: Fetch vendor assets (private repo)
        if: env.ASSETS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets/vendor
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 운영판은 개발 기능을 뺀다(0193). 다른 갈래는 기본값(dev)을 쓴다.
      - name: Build flavor
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"; echo "FLAVOR=release" >> "$GITHUB_ENV"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"; echo "FLAVOR=dev" >> "$GITHUB_ENV"
          fi

      - run: cargo fmt --all -- --check
      # 두 갈래 다 경고가 없어야 한다(cfg(feature = "dev")로만 쓰이는 것이 운영판에서 죽은 코드가 되지 않게).
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings
      # 단위 테스트는 호스트(리눅스)에서. macroquad·gilrs·quad-snd 링크용 시스템 라이브러리.
      - name: Install Linux libs for host tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown $FEATURES

      - name: Assemble publish dir
        run: |
          mkdir -p dist
          cp web/index.html web/*.js dist/
          cp assets/THIRD_PARTY_LICENSES.txt dist/
          cp target/wasm32-unknown-unknown/release/nail.wasm dist/
          [ -d assets ] && cp -r assets dist/assets || true
          # 어느 커밋이 올라갔는지(배포 확인용).
          echo "$GITHUB_SHA $FLAVOR" > dist/build.txt
          # 개발판: 탭 이름에 표시, 검색에 안 잡히게.
          if [ "$FLAVOR" = "dev" ]; then
            sed -i -e 's|<title>\(.*\)</title>|<title>\1 (dev)</title>|' \
                   -e 's|<meta charset="utf-8">|<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">|' dist/index.html
            grep -n "<title>\|robots" dist/index.html
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v4
        if: env.NETLIFY_SITE_ID != ''
        with:
          node-version: 22

      # Netlify 시크릿이 설정되기 전에는 아래 두 단계가 건너뛰어진다 (빌드 검증만).
      - name: Deploy production
        if: env.NETLIFY_SITE_ID != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx netlify-cli@23 deploy --dir=dist --prod --message="${{ github.sha }}"

      # 개발판(0193): 운영(--prod)은 건드리지 않는다. 같은 별칭을 다시 쓰면 그 주소가 새 배포를 가리킨다고 보지만
      # 포럼 답이 엇갈려서, 올린 뒤 별칭 주소의 build.txt를 읽어 이 커밋인지 확인한다(아니면 실패).
      - name: Deploy dev (alias)
        if: env.NETLIFY_SITE_ID != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          npx netlify-cli@23 deploy --dir=dist --alias=dev --message="${{ github.ref_name }} ${{ github.sha }}" --json > deploy.json
          cat deploy.json
          # 별칭 배포의 deploy_url이 곧 dev--<사이트> 주소다. 없으면 사이트 이름으로 짓는다.
          url=$(node -e 'const j=require("./deploy.json"); const u=(j.deploy_url||"").replace(/\/$/,""); console.log(u.includes("://dev--") ? u : "https://dev--"+j.site_name+".netlify.app")')
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "$url/build.txt?t=$(date +%s)" || true)
            echo "try $i: $got"
            case "$got" in "$GITHUB_SHA"*) ok=1; break;; esac
            sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::$url 이 이 커밋($GITHUB_SHA)을 가리키지 않는다"; exit 1; fi
          echo "### 개발판: $url (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy PR preview
        if: env.NETLIFY_SITE_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        run: npx netlify-cli@23 deploy --dir=dist --alias="pr-${{ github.event.number }}"
