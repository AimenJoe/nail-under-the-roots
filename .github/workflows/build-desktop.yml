name: build-desktop
# PC 빌드(0240): Windows(x64 zip) · macOS(인텔+애플 실리콘 겸용 .app zip) · Linux(x64 tar.gz).
# - release/** push: 개발판(기본 기능)을 Actions 아티팩트로.
# - release.yml이 부를 때(release_tag): 운영판(--no-default-features)을 만들어 그 태그의 GitHub Release에 붙인다.
# - 손으로: Actions → build-desktop → Run workflow(브랜치 고르기, 0169 R8와 같은 방식). release_tag를 넣으면 그 Release에 운영판을 붙인다(릴리스 때 빠진 묶음 채우기).
# - store-deploy.yml이 부를 때(store = steam | epic, 0276 S4·E4): 운영판 + 상점 기능(--features steam|epic)을 만들어
#   아티팩트로만 둔다(Release에 붙이지 않는다). epic은 Windows·macOS만(Epic 런처에 Linux 없음) — EOS 아이디는
#   Environment `store`에서 빌드 때 넣고, EOS SDK(.lib·.dll)는 비공개 에셋 레포의 Release `eos`에서 받는다(tools/epic/fetch_eos.sh).
# main push마다는 돌리지 않는다: macOS 러너는 분당 비용이 리눅스의 약 10배라(레포를 비공개로 바꾸면 유료, 0237) 릴리스·개발판에서만.
# 묶음 안: 실행 파일 + assets(웹 전용 mp3·vendor/.git 뺌) + 제3자 고지. 게임은 실행 파일 옆(또는 .app/Contents/Resources)의
# assets를 찾는다(src/main.rs `assets_dir`). 서명: macOS는 임시(ad-hoc) 서명만, Windows는 서명 없음 — docs/decisions/0240.
on:
  push:
    branches: ['release/**']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'third_party/**'
      - 'pc/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '이미 있는 Release에 운영판 묶음을 다시 붙일 때만(예: v0.9.1). 비우면 개발판 아티팩트만'
        required: false
        default: ''
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      store:
        type: string
        required: false
        default: ''

concurrency:
  group: desktop-${{ inputs.store }}${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # glibc를 낮게: 오래된 배포판·Steam Deck(SteamOS)에서도 뜨게 리눅스는 22.04에서 빌드한다. Epic 판은 Linux가 없다.
        include: ${{ fromJSON(inputs.store == 'epic' && '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]' || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"},{"os":"ubuntu-22.04","name":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    # Epic 판만 EOS 아이디가 필요하다 — 그때만 Environment `store`(배포 갈래·사람 승인)에 들어간다.
    environment: ${{ inputs.store == 'epic' && 'store' || '' }}
    permissions:
      contents: write   # release_tag일 때 Release에 붙이기
    env:
      ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
      STORE: ${{ inputs.store }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 운영·상점 판은 유료 팩 그림 없이 나가지 않는다(0277) — 시크릿이 없으면 대체 그림으로 조용히 빌드되던 자리.
      - name: Require vendor assets for release
        if: env.ASSETS_REPO == '' && (inputs.release_tag != '' || inputs.store != '')
        run: echo "::error::ASSETS_REPO 시크릿이 없다 — 운영·상점 판을 대체 그림으로 내보내지 않는다"; exit 1

      # 유료 에셋 팩(레포 밖, 0010). 시크릿이 없으면 건너뛰고 직접 그린 대체 그림으로 빌드한다.
      # persist-credentials: false — 묶음에 assets/vendor/.git이 실려도 토큰이 남지 않게(0235 R23).
      - name: Fetch vendor assets (private repo)
        if: env.ASSETS_REPO != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets/vendor
          persist-credentials: false

      # Rust 버전은 rust-toolchain.toml 한 곳, 툴체인·캐시 액션은 SHA 고정(0277).
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          cache-key: ${{ matrix.name }}

      - name: Linux build deps
        if: matrix.name == 'linux'
        # libudev: 패드(gilrs)가 리눅스에서 장치를 찾을 때 쓴다.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev

      - name: Flavor
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$STORE" ]; then
            # 상점 판: 운영판 + 상점 기능. 묶음 이름 = 상점 이름.
            echo "FEATURES=--no-default-features --features $STORE" >> "$GITHUB_ENV"; echo "FLAVOR=$STORE" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"; echo "FLAVOR=release" >> "$GITHUB_ENV"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"; echo "FLAVOR=dev" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      # Steam 판 리눅스: 실행 파일 옆의 libsteam_api.so를 찾게 rpath $ORIGIN(Steam은 게임 폴더를 LD_LIBRARY_PATH에 넣어 주지 않는다고 본다 — 실기 확인 전).
      - name: Store build env
        if: inputs.store != ''
        env:
          EOS_PRODUCT_ID: ${{ secrets.NAIL_EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.NAIL_EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.NAIL_EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.NAIL_EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.NAIL_EOS_CLIENT_SECRET }}
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ "$STORE" = steam ] && [ "${{ matrix.name }}" = linux ]; then
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,\$ORIGIN" >> "$GITHUB_ENV"
          fi
          if [ "$STORE" = epic ]; then
            # EOS 아이디는 빌드에 박는다(option_env!, src/epic.rs). 값은 로그에 찍지 않는다.
            for k in PRODUCT_ID SANDBOX_ID DEPLOYMENT_ID CLIENT_ID CLIENT_SECRET; do
              v="EOS_$k"; echo "NAIL_EOS_$k=${!v}" >> "$GITHUB_ENV"
            done
            if [ "${{ matrix.name }}" = windows ]; then
              # 큰 파일이라 레포가 아니라 Release 첨부(0276 E4). 작업 폴더 안 상대 경로로(Git Bash의 Windows 경로 섞임을 피한다), 묶음엔 안 실린다.
              sdk=$(GH_TOKEN="$ASSETS_TOKEN" bash tools/epic/fetch_eos.sh sdk .eos | tail -1)
              echo "EOS_SDK_DIR=$GITHUB_WORKSPACE/$sdk" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: cargo build --release $FEATURES
      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: cargo build --release $FEATURES
      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release $FEATURES --target aarch64-apple-darwin
          cargo build --release $FEATURES --target x86_64-apple-darwin
          lipo -create -output target/release-nail-universal \
            target/aarch64-apple-darwin/release/nail target/x86_64-apple-darwin/release/nail
          lipo -info target/release-nail-universal

      # 묶기(assets 고르기·아이콘·Info.plist·서명·상점 재배포 파일)는 한 곳: tools/pc/package.sh.
      - name: Package
        run: tools/pc/package.sh "${{ matrix.name }}" "$FLAVOR" "$STORE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nail-${{ matrix.name }}-${{ env.FLAVOR }}-${{ github.sha }}
          path: ${{ env.PKG }}
          retention-days: 7

      - name: Attach to Release
        if: inputs.release_tag != '' && inputs.store == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ env.PKG }}
