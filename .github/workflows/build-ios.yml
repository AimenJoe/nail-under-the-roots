name: build-ios
# iOS 빌드(docs/decisions/0086). 지금은 **서명하지 않은 .ipa**만 만든다(Actions 아티팩트).
# 내 기기에서 시험: 받은 nail-ios-unsigned.ipa를 Sideloadly·AltStore로 내 Apple ID로 서명해 설치(무료 계정은 7일마다 다시).
# 나중에 TestFlight·App Store로 내려면 Apple Developer Program 인증서·프로비저닝 프로필을 Secrets에 두고 서명 단계를 더한다.
# 공개 레포의 macOS 러너는 무료. main push(관련 파일)와 수동 실행(작업 브랜치는 Run workflow에서 고른다, 0169 R8).
# 갈래(0193): main = 운영판(--no-default-features). release/**·수동 실행 = 개발판(개발 기능 + 번들 아이디 `.dev`, 이름 "Naïl dev").
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'ios/**'
      - 'third_party/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    env:
      ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
    steps:
      - uses: actions/checkout@v4

      # 유료 에셋 팩(레포 밖, docs/decisions/0010). 시크릿이 없으면 건너뛰고 직접 그린 대체 타일로 빌드한다.
      - name: Fetch vendor assets (private repo)
        if: env.ASSETS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets/vendor
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2

      - name: Build flavor
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"; echo "FLAVOR=release" >> "$GITHUB_ENV"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"; echo "FLAVOR=dev" >> "$GITHUB_ENV"
          fi

      - name: Build (aarch64-apple-ios, release)
        run: cargo build --release --target aarch64-apple-ios $FEATURES

      - name: Assemble Naïl.app and unsigned ipa
        run: |
          set -e
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          b=$(sed -n 's/^version_code = \([0-9]*\)/\1/p' Cargo.toml | head -1)
          app=Payload/Nail.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/release/nail "$app/nail"
          # 게임은 "assets/…" 경로로 읽는다(set_pc_assets_folder). miniquad iOS는 NSBundle에서 찾으므로 .app 바로 아래에.
          cp -R assets "$app/assets"
          rm -rf "$app/assets/vendor/.git"
          # 웹 전용 mp3는 싣지 않는다(네이티브는 ogg만, 0235 R20).
          rm -f "$app"/assets/music/*.mp3
          cp ios/icons/*.png "$app/"
          sed -e "s/__VERSION__/$v/" -e "s/__BUILD__/$b/" ios/Info.plist > "$app/Info.plist"
          if [ "$FLAVOR" = "dev" ]; then
            # 운영 앱과 나란히 깔리게(기록도 따로): 번들 아이디·보이는 이름만 바꾼다.
            sed -i '' -e 's|<string>io.github.aimenjoe.nail</string>|<string>io.github.aimenjoe.nail.dev</string>|' \
                      -e 's|<string>Naïl</string>|<string>Naïl dev</string>|g' "$app/Info.plist"
            grep -q "io.github.aimenjoe.nail.dev" "$app/Info.plist"
          fi
          plutil -lint "$app/Info.plist"
          echo "APPL????" > "$app/PkgInfo"
          ditto -c -k --sequesterRsrc --keepParent Payload nail-ios-unsigned.ipa
          ls -la nail-ios-unsigned.ipa
          du -sh "$app"
          file "$app/nail"

      - uses: actions/upload-artifact@v4
        with:
          name: nail-ios-unsigned-${{ env.FLAVOR }}
          path: nail-ios-unsigned.ipa
          if-no-files-found: error
