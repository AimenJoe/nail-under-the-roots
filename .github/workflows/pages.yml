name: pages
# 공식 페이지(site/)를 GitHub Pages에 올린다(docs/decisions/0069). 게임 자체는 Netlify(deploy-web.yml, 0001).
# 글꼴 서브셋·캐시 해시는 레포에 두지 않고 여기서 만든다(make_images.py --stamp, 0287 — 갈래끼리 생성물이 충돌했다).
# 처음 한 번 사람이 레포 Settings → Pages → Source를 "GitHub Actions"로 둬야 한다(GITHUB_TOKEN으로는 켤 수 없다).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/make_images.py'
      - 'assets/fonts/Galmuri11-Condensed.ttf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stamp (font subset + cache hashes)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet fonttools brotli
          .venv/bin/python tools/site/make_images.py --stamp _site
          ls -la _site/fonts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
