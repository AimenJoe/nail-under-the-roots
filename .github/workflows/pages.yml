name: pages
# 공식 페이지(site/)를 GitHub Pages에 올린다(docs/decisions/0069). 게임 자체는 Netlify(deploy-web.yml, 0001).
# 처음 한 번 사람이 레포 Settings → Pages → Source를 "GitHub Actions"로 둬야 한다(GITHUB_TOKEN으로는 켤 수 없다).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
