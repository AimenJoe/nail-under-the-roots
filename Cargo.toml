[package]
name = "nail"
version = "0.1.6"
authors = ["Beardworks"]
edition = "2021"
description = "Naïl: Under the Roots — 귀여운 탑다운 액션 로그라이트"
publish = false

[features]
# dev: 타이틀의 "개발" 시나리오 메뉴. 스토어 배포 빌드는 --no-default-features.
default = ["dev"]
dev = []

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

# gamepads 0.1.7은 Android에서 `android-winit` feature 없이는 컴파일되지 않는다(poll_android_winit 미정의).
# 그 feature는 winit 전용이라 miniquad와 맞지 않으므로 Android 빌드에서는 크레이트를 아예 뺀다.
# Android 게임패드는 miniquad 포크로 해결 (docs/decisions/0002, KB reference/macroquad/gamepad-and-android-input.md).
[target.'cfg(not(target_os = "android"))'.dependencies]
gamepads = { version = "0.1.7", default-features = false }

# 기기 언어 감지(docs/decisions/0013). 웹은 wasm-bindgen 없이 index.html 플러그인으로 읽으므로 뺀다.
# Android는 libc의 시스템 속성(persist.sys.locale)을 읽는다.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = "0.3"

# cargo-quad-apk 설정 (.github/workflows/build-android.yml, docs/decisions/0005)
[package.metadata.android]
package_name = "io.github.aimenjoe.nail"
label = "Naïl: Under the Roots"
# compileSdk / targetSdk. GitHub 러너와 cargo-quad-apk 기본값(36)에 맞춤.
android_version = 36
target_sdk_version = 36
# Android 8.0. 핸드헬드는 11+ 이므로 여유.
min_sdk_version = 26
# 실기 핸드헬드는 arm64. 에뮬레이터가 필요해지면 x86_64-linux-android 추가.
build_targets = ["aarch64-linux-android"]
fullscreen = true
# APK에 넣을 에셋 폴더(폰트 등). 코드는 set_pc_assets_folder("assets")로 플랫폼별 경로를 맞춘다.
assets = "assets"
# 앱 스토어 업데이트 판정용 정수. 배포할 때마다 올린다.
version_code = 7

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"
# targetSdk 31+에서 intent-filter가 있는 액티비티는 exported를 꼭 적어야 설치된다(없으면 "패키지가 잘못됨", 0074).
"android:exported" = "true"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Android 게임패드 버튼을 받도록 고친 miniquad(docs/decisions/0075, third_party/miniquad/PATCHED.md).
[patch.crates-io]
miniquad = { path = "third_party/miniquad" }
