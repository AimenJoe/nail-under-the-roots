<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Naïl: Under the Roots</title>
  <style>
    /* 모바일: 스크롤·확대·길게 누르기 메뉴를 막고 터치를 전부 캔버스로 보낸다. */
    html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: absolute; background: black; z-index: 0;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- 레포 복사본. macroquad 버전을 올리면 같은 태그의 js/mq_js_bundle.js 로 함께 갱신 (web/README.md) -->
  <script src="mq_js_bundle.js"></script>
  <!-- gamepads 크레이트의 macroquad 플러그인. 레포 복사본(web/README.md). 핫링크 금지. -->
  <script src="macroquad-gamepads-0.1.js"></script>
  <!-- 브라우저 언어 → 게임 언어(src/i18n.rs). 0 모름, 1 한국어, 2 그 밖. -->
  <script>
    miniquad_add_plugin({
      name: "nail_locale",
      version: 1,
      register_plugin: function (importObject) {
        importObject.env.nail_locale = function () {
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          var first = (langs[0] || "").toLowerCase();
          if (!first) return 0;
          return first.indexOf("ko") === 0 ? 1 : 2;
        };
      }
    });
    load("nail.wasm");
  </script>
</body>
</html>
