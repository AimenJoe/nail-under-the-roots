<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- PWA(0269): 설치·홈 화면. iOS는 매니페스트 대신 apple-* 메타를 읽는다. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f1724">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Naïl">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="author" content="Beardworks">
  <meta name="copyright" content="© 2026 Beardworks">
  <title>Naïl: Under the Roots</title>
  <style>
    /* 모바일: 스크롤·확대·길게 누르기 메뉴를 막고 터치를 전부 캔버스로 보낸다. */
    html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: absolute; background: black; z-index: 0;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* 로딩 화면(docs/decisions/0028): 글 없이 걷는 Naïl + 막대. 첫 프레임이 그려지면 걷는다. 색은 게임 팔레트. */
    #loading { position: absolute; inset: 0; z-index: 2; background: #1f1724; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; transition: opacity .25s; }
    #loading.done { opacity: 0; pointer-events: none; }
    /* 시트는 24px 칸(art::NAIL_CELL, 0206) × 4배. 크기는 높이(6줄 = 576px)만 정하고 폭은 auto — 시트에 칸이 늘어도(0082: 9칸) 칸이 찌그러지지 않는다. 걷기 = 줄 0의 칸 2~5. */
    #loading .mole { width: 96px; height: 96px; background: url("assets/art/nail.png") 0 0 / auto 576px no-repeat;
      image-rendering: pixelated; animation: walk .5s steps(4) infinite; }
    @keyframes walk { from { background-position: -192px 0; } to { background-position: -576px 0; } }
    #loading .bar { width: 160px; height: 8px; border: 2px solid #5c4a3c; padding: 2px; background: #140e18; }
    #loading .fill { height: 100%; width: 0%; background: #e6b578; transition: width .15s; }
    @media (prefers-reduced-motion: reduce) { #loading .mole { animation: none; background-position: -192px 0; } }
    /* 세로로 든 터치 기기(0269): 글 없는 회전 그림 — 폰이 세로에서 가로로 돈다. 누르면 이번 창에서는 세로로 계속. */
    #rotate { position: absolute; inset: 0; z-index: 3; background: rgba(20,14,24,.92); display: none;
      align-items: center; justify-content: center; cursor: pointer; }
    #rotate.on { display: flex; }
    #rotate .phone { width: 44px; height: 76px; border: 4px solid #e6b578; border-radius: 8px; position: relative;
      animation: turn 2.2s ease-in-out infinite; }
    #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 8px; height: 4px; margin-left: -4px; background: #e6b578; }
    #rotate .arrow { position: absolute; width: 112px; height: 112px; border: 3px dashed #5c4a3c; border-radius: 50%;
      border-left-color: transparent; border-bottom-color: transparent; }
    @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="rotate" aria-hidden="true"><div class="arrow"></div><div class="phone"></div></div>
  <div id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="mole"></div>
    <div class="bar"><div class="fill"></div></div>
  </div>
  <!-- 로딩 진행: 0~60% = nail.wasm 받은 바이트(fetch를 감싸 센다), 60~100% = 게임이 알려 주는 준비 단계(src/loading.rs).
       압축 전송이면 Content-Length가 실제보다 작을 수 있어 받은 양으로 추정하고 95%에서 멈춘다. -->
  <script>
    (function () {
      var box = document.getElementById("loading"), fill = box.querySelector(".fill");
      var wasmPart = 0, stepPart = 0;
      function show() {
        var p = Math.min(1, wasmPart * 0.6 + stepPart * 0.4);
        fill.style.width = (p * 100).toFixed(1) + "%";
        box.setAttribute("aria-valuenow", Math.round(p * 100));
      }
      var origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = typeof input === "string" ? input : (input && input.url) || "";
        if (!/nail\.wasm(\?|$)/.test(url)) return origFetch(input, init);
        return origFetch(input, init).then(function (res) {
          if (!res.ok || !res.body || !window.ReadableStream) { wasmPart = 1; show(); return res; }
          var total = parseInt(res.headers.get("Content-Length"), 10) || 900000, got = 0, reader = res.body.getReader(), chunks = [];
          function pump() {
            return reader.read().then(function (r) {
              if (r.done) { wasmPart = 1; show(); return new Response(new Blob(chunks, { type: "application/wasm" }), { headers: { "Content-Type": "application/wasm" } }); }
              chunks.push(r.value); got += r.value.length;
              wasmPart = Math.min(0.95, got / Math.max(total, got * 1.05)); show();
              return pump();
            });
          }
          return pump();
        });
      };
      window.__nailLoading = {
        step: function (done, all) { wasmPart = 1; stepPart = all ? done / all : 1; show(); },
        ready: function () {
          wasmPart = 1; stepPart = 1; show();
          box.classList.add("done");
          setTimeout(function () { box.remove(); }, 400);
          var c = document.getElementById("glcanvas"); if (c) c.focus();
        }
      };
    })();
  </script>
  <!-- WebGL 컨텍스트 옵션: 번들은 옵션 없이 getContext("webgl"/"webgl2")를 불러 브라우저 기본값(안티에일리어싱 켬,
       투명 배경)이 된다. 고배율 화면(아이폰 dpr 3 → 캔버스 약 2532×1170)에서 매 프레임 4배 샘플을 칠하고 합치는 비용이 크고,
       도트 그림에는 쓸모가 없다. 번들 복사본은 고치지 않고 여기서 옵션만 끼운다(docs/decisions/0026). -->
  <script>
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (this.id === "glcanvas" && (type === "webgl" || type === "webgl2")) {
          attrs = Object.assign({ antialias: false, alpha: false, powerPreference: "high-performance" }, attrs || {});
        }
        return orig.call(this, type, attrs);
      };
    })();
  </script>
  <!-- 레포 복사본. macroquad 버전을 올리면 같은 태그의 js/mq_js_bundle.js 로 함께 갱신 (web/README.md) -->
  <script src="mq_js_bundle.js"></script>
  <!-- gamepads 크레이트의 macroquad 플러그인. 레포 복사본(web/README.md). 핫링크 금지. -->
  <script src="macroquad-gamepads-0.1.js"></script>
  <!-- 게임 쪽 다리(플러그인·PWA·화면, 0269 R37). 끝에서 nail.wasm을 띄운다. -->
  <script src="nail-host.js"></script>
</body>
</html>
